name: Sync Open Source Contributions

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 IST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Upstream PRs from GitHub Search API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_contributions.py

      - name: Commit and Push Changes (if updated)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/contributions.json
          if git diff --staged --quiet; then
            echo "No new contributions detected. Everything is up to date."
          else
            git commit -m "chore(data): auto-sync open source contributions via GitHub Actions"
            git push
          fi

